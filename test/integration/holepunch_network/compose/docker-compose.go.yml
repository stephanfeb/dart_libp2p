# go-libp2p interop variant of docker-compose.yml: peer-a is Dart, peer-b and
# the relay are go-libp2p (containers/go-peer). Run it with
# scripts/run_dcutr_scenario.sh --go.
#
# The simulated internet is 11.70.0.0/16 here rather than 100.70.0.0/16:
# go-libp2p only hole punches from addresses it considers public, and it
# treats 100.64.0.0/10 as private. The networks stay isolated in Docker.
#
# The relay is go-libp2p too, so the Dart peer is the only Dart component;
# the Dart relay in docker-compose.yml also serves go clients.

networks:
  public_net:
    driver: bridge
    name: holepunch_go_public
    ipam:
      config:
        - subnet: 11.70.0.0/16
          gateway: 11.70.0.1

  nat_a_net:
    driver: bridge  
    name: holepunch_go_nat_a
    # Not internal - allows routing through NAT gateway to public_net
    # NAT behavior is enforced by iptables rules in nat-gateway-a
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1

  nat_b_net:
    driver: bridge
    name: holepunch_go_nat_b
    # Not internal - allows routing through NAT gateway to public_net
    # NAT behavior is enforced by iptables rules in nat-gateway-b
    ipam:
      config:
        - subnet: 192.168.2.0/24
          gateway: 192.168.2.1

  control_net:
    driver: bridge
    name: holepunch_go_control
    internal: false  # Allows host access for test orchestration
    ipam:
      config:
        - subnet: 172.26.0.0/16
          gateway: 172.26.0.1

services:
  # NAT Gateway A - MINIMAL TEST (single network only)
  nat-gateway-a:
    build:
      context: ../containers/nat-gateway
      args:
        NAT_TYPE: ${NAT_A_TYPE:-cone}
    container_name: nat-gateway-a
    networks:
      public_net:
        ipv4_address: 11.70.1.10
      nat_a_net:
        ipv4_address: 192.168.1.10
    environment:
      - NAT_TYPE=${NAT_A_TYPE:-cone}
      - WAN_DELAY=${WAN_DELAY:-50ms}
      - INTERNAL_SUBNET=192.168.1.0/24
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    privileged: true
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.route_localnet=1
    depends_on:
      - stun-server
      - relay-server

  # NAT Gateway B - Full NAT functionality
  nat-gateway-b:
    build:
      context: ../containers/nat-gateway
      args:
        NAT_TYPE: ${NAT_B_TYPE:-cone}
    container_name: nat-gateway-b
    networks:
      public_net:
        ipv4_address: 11.70.1.20
      nat_b_net:
        ipv4_address: 192.168.2.10
    environment:
      - NAT_TYPE=${NAT_B_TYPE:-cone}
      - WAN_DELAY=${WAN_DELAY:-50ms}
      - INTERNAL_SUBNET=192.168.2.0/24
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    privileged: true
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.route_localnet=1
    depends_on:
      - nat-gateway-a
      - stun-server
      - relay-server

  # STUN Server for internal address discovery (isolated)
  stun-server:
    image: coturn/coturn:latest
    container_name: stun-server
    networks:
      public_net:
        ipv4_address: 11.70.2.10
    # No external ports - completely isolated
    command: |
      turnserver
      --listening-port=3478
      --fingerprint
      --lt-cred-mech
      --realm=holepunch.test
      --stun-only

  # Circuit Relay Server (Public) - go-libp2p relay v2
  relay-server:
    build:
      context: ../../../../../
      dockerfile: dart-libp2p/test/integration/holepunch_network/containers/go-peer/Dockerfile
    container_name: relay-server
    ports:
      - "8083:8080"
    networks:
      public_net:
        ipv4_address: 11.70.3.10
      control_net:
        ipv4_address: 172.26.0.12
    environment:
      - ROLE=relay

  # Peer A (Behind NAT-A)
  peer-a:
    build:
      context: ../../../../../  # agentic/ directory to include dart-udx
      dockerfile: dart-libp2p/test/integration/holepunch_network/containers/dart-peer/Dockerfile
    container_name: peer-a
    ports:
      - "8081:8080"  # Control API port mapping
    networks:
      nat_a_net:
        ipv4_address: 192.168.1.100
      control_net:  # Control API only - NO direct access to public_net
        ipv4_address: 172.26.0.10
    cap_add:
      - NET_ADMIN  # Needed for route manipulation
    environment:
      - PEER_ROLE=peer
      - PEER_NAME=peer-a
      - LISTEN_ADDRS=/ip4/192.168.1.100/tcp/4001,/ip4/192.168.1.100/udp/4001/udx  # Bind ONLY to private network
      # The NAT keeps the source port, so the listener's UDX port maps to the
      # same port on the gateway's public address. Advertised to peers in
      # DCUtR CONNECT (operator-supplied external address).
      - EXTERNAL_ADDRS=/ip4/11.70.1.10/udp/4001/udx
      - DEBUG_LOGGERS=p2p-holepunch,UDXTransport
      - ENABLE_HOLEPUNCH=true
      - RELAY_SERVERS=/ip4/11.70.3.10/tcp/4001/p2p/12D3KooWKZA9C2aY5vhvmNGHapv4aXXKUHTz3TpQGhmGNwRgQh9P
      - ENABLE_AUTORELAY=true
      - STUN_SERVERS=11.70.2.10:3478
      - NAT_GATEWAY=192.168.1.10
      - PUBLIC_NET_SUBNET=11.70.0.0/16  # Route to public network through NAT gateway
    depends_on:
      - nat-gateway-a
      - relay-server
      - stun-server
    volumes:
      - ../../../../../dart-libp2p/test/integration/holepunch_network/containers/dart-peer/config:/app/config

  # Peer B: go-libp2p DCUtR peer (Behind NAT-B)
  peer-b:
    build:
      context: ../../../../../
      dockerfile: dart-libp2p/test/integration/holepunch_network/containers/go-peer/Dockerfile
    container_name: peer-b
    ports:
      - "8082:8080"
    networks:
      nat_b_net:
        ipv4_address: 192.168.2.100
      control_net:
        ipv4_address: 172.26.0.11
    cap_add:
      - NET_ADMIN
    environment:
      - LISTEN_UDX=/ip4/192.168.2.100/udp/4001/udx
      - EXTERNAL_ADDRS=/ip4/11.70.1.20/udp/4001/udx
      - GOLOG_LOG_LEVEL=${GOLOG_LOG_LEVEL:-error}
      - RELAY_SERVERS=/ip4/11.70.3.10/tcp/4001/p2p/12D3KooWKZA9C2aY5vhvmNGHapv4aXXKUHTz3TpQGhmGNwRgQh9P
      - NAT_GATEWAY=192.168.2.10
      - PUBLIC_NET_SUBNET=11.70.0.0/16
    depends_on:
      - nat-gateway-b
      - relay-server
